name: Sovereign402 escrow safety gates
on:
  pull_request:
  push:
    branches:
      - feat/sovereign402-gateway-20261106
permissions:
  contents: read
jobs:
  local-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run contracts:compile
      - run: npm run contracts:test
      - run: PYTHONWARNINGS=error::ResourceWarning python3 -m unittest discover -s tests -q
