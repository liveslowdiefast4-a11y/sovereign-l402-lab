# Public, unprivileged independent CI reproduction; no keys, wallets or transactions.
image: python:3.12-slim
stages:
  - verify

research-tests:
  stage: verify
  timeout: 6m
  script:
    - python --version
    - python -m compileall -q sovereign_l402 tests
    - python -m unittest discover -s tests -v
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
