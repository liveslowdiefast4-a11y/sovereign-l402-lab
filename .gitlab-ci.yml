# Public, unprivileged independent CI reproduction; no keys, wallets or transactions.
image: python:3.12-slim
stages:
  - verify

research-tests:
  stage: verify
  timeout: 6m
  script:
    - python --version
    - python -m compileall -q sovereign_l402 tests
    - python -m unittest discover -s tests -v
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

real-lnd-regtest:
  stage: verify
  image: docker:27-cli
  services:
    - name: docker:27-dind
      command: ["--tls=false"]
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    DOCKER_DRIVER: overlay2
  timeout: 20m
  before_script:
    - apk add --no-cache bash git python3
    - docker info
    - docker compose version
  script:
    - bash regtest/run.sh
  after_script:
    - docker compose -f regtest/docker-compose.yml down --volumes --remove-orphans || true
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - regtest-evidence.json
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
